[project]
name = "doc-critic"
version = "0.1.0"
description = "Агент на Claude, который критикует документы и выдаёт отчёт с замечаниями"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.80"]

[project.scripts]
doc-critic = "doc_critic.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["doc_critic"]
